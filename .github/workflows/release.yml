name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match pom.xml, e.g. 0.11.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: marioatwired/jasmine

jobs:
  build:
    name: Build Release JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tag is the current master head
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          MASTER_SHA=$(git rev-parse refs/remotes/origin/master)
          if [ "$GITHUB_SHA" != "$MASTER_SHA" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, but master is ${MASTER_SHA}. Tag the current master head."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          POM_VERSION=$(grep -m 1 '<version>' pom.xml | sed 's/.*<version>\([^<]*\)<\/version>.*/\1/' | tr -d ' ')
          if [ "$POM_VERSION" != "$VERSION" ]; then
            echo "::error::pom.xml version ($POM_VERSION) does not match release version ($VERSION)"
            exit 1
          fi
          if echo "$VERSION" | grep -q '-'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing Jasmine $VERSION (prerelease: $PRERELEASE)"

      - name: Build and test
        run: |
          COMMIT_TIME=$(git log -1 --format=%cI)
          ./mvnw --batch-mode verify -Pcoverage -Dproject.build.outputTimestamp="$COMMIT_TIME"

      - name: Rename release JAR
        run: mv target/*-All.jar "Jasmine-${{ steps.version.outputs.version }}.jar"

      - name: Smoke test release JAR
        run: bash scripts/smoke-test-jar.sh "Jasmine-${{ steps.version.outputs.version }}.jar"

      - name: Generate SHA-256 checksum
        run: sha256sum "Jasmine-${{ steps.version.outputs.version }}.jar" > "Jasmine-${{ steps.version.outputs.version }}.jar.sha256"

      - name: Upload release JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-jar
          path: Jasmine-*
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  docker-smoke:
    name: Docker Smoke Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build smoke image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: jasmine:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker smoke test
        run: bash scripts/smoke-test-docker.sh jasmine:smoke

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jasmine:smoke
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif

  docker:
    name: Publish Release Image
    needs:
      - build
      - docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve build timestamp
        id: timestamp
        run: echo "value=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest,enable=${{ needs.build.outputs.prerelease != 'true' }}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: ./.github/actions/docker-build
        with:
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          timestamp: ${{ steps.timestamp.outputs.value }}
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

      - name: Verify published image manifest
        run: docker buildx imagetools inspect "ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}"

      - name: Verify image attestations
        run: bash scripts/verify-image-attestations.sh "ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}"

  release:
    name: Create GitHub Release
    needs:
      - build
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release JAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-jar
          path: .

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ needs.build.outputs.version }}
          name: Jasmine v${{ needs.build.outputs.version }}
          commit: ${{ github.sha }}
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          artifacts: 'Jasmine-*'
          body: |
            Jasmine v${{ needs.build.outputs.version }}

            ### Install

            Download `Jasmine-${{ needs.build.outputs.version }}.jar` and follow the
            [setup guide](https://github.com/marioatwired/Jasmine/blob/master/docs/SETUP.md).

            Docker:

            ```bash
            docker pull ghcr.io/marioatwired/jasmine:${{ needs.build.outputs.version }}
            ```

            ### Verify download

            The release includes `Jasmine-${{ needs.build.outputs.version }}.jar.sha256`.
            Compare it with the downloaded JAR using `sha256sum -c` or `Get-FileHash`.

            ### Verify the container image

            The image includes SPDX SBOM and SLSA provenance attestations:

            ```bash
            docker buildx imagetools inspect \
              ghcr.io/marioatwired/jasmine:${{ needs.build.outputs.version }} \
              --format '{{ json (index .Provenance "linux/amd64").SLSA }}'
            docker buildx imagetools inspect \
              ghcr.io/marioatwired/jasmine:${{ needs.build.outputs.version }} \
              --format '{{ json (index .SBOM "linux/amd64").SPDX }}'
            ```

            ### Configuration

            Existing `config.txt` files are migrated automatically. See the
            [configuration reference](https://github.com/marioatwired/Jasmine/blob/master/docs/CONFIG.md).

            Full changelog: https://github.com/marioatwired/Jasmine/blob/master/CHANGELOG.md
