name: 'Docker Build and Push'
description: 'Builds and pushes a multi-arch Docker image to GHCR with caching'

inputs:
  tags:
    description: 'Docker image tags (from metadata-action)'
    required: true
  annotations:
    description: 'OCI annotations from metadata-action (for multi-arch images)'
    required: true
  timestamp:
    description: 'Build timestamp in ISO 8601 format'
    required: true
  registry:
    description: 'Container registry (e.g., ghcr.io)'
    required: false
    default: 'ghcr.io'
  image-name:
    description: 'Image name (e.g., marioatwired/jasmine)'
    required: false
    default: 'marioatwired/jasmine'
  token:
    description: 'GitHub token for authentication'
    required: true

outputs:
  digest:
    description: 'Docker image digest'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        driver-opts: |
          network=host

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ inputs.tags }}
        annotations: ${{ inputs.annotations }}
        provenance: mode=max
        sbom: true
        cache-from: |
          type=gha
          type=registry,ref=${{ inputs.registry }}/${{ inputs.image-name }}:buildcache
        cache-to: |
          type=gha,mode=max
          type=registry,ref=${{ inputs.registry }}/${{ inputs.image-name }}:buildcache,mode=max
        platforms: linux/amd64,linux/arm64
        build-args: |
          BUILD_TIMESTAMP=${{ inputs.timestamp }}

    - name: Image digest
      shell: bash
      run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
